
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body>

    <h1>Hello {{ name }}</h1>

    {% if is_topper %}
        <p>You are a Topper</p>
    {% else %}
        <p>You are average</p>
    {% endif %}

    <br>

    <h3>Your Subjects</h3>

    <ul>
        {% for sub in subjects %}
            <li>{{ sub }}</li>
        {% endfor %}
    </ul>

</body>
</html>
