<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} My Feedback Site {% endblock %}</title>
    
</head>
<body>
    <header>
        <h2>Welcome to My Site</h2>
        <nav>
            <a href="/">Home</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul style="color: green;">
            {% for msg in messages %}
            <li>{{ msg }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}
    </main>
    {% block content %}{% endblock %}
</body> 
</html>
